<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sonali Singh — data, AI, strategy, and product</title>
  <desc id="desc">An animated navy and cobalt profile banner inspired by Sonali Singh's portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#08142f"/><stop offset=".55" stop-color="#122247"/><stop offset="1" stop-color="#0b1734"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="43%" r="50%"><stop offset="0" stop-color="#4f8cff" stop-opacity=".7"/><stop offset=".45" stop-color="#2867f7" stop-opacity=".22"/><stop offset="1" stop-color="#2867f7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9db9ff" stroke-opacity=".075"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <style>.cursor{animation:blink 1s steps(2,end) infinite}.pulse{animation:pulse 4s ease-in-out infinite}.drift{animation:drift 7s ease-in-out infinite alternate}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:.28}50%{opacity:.72}}@keyframes drift{to{transform:translateX(22px)}}</style>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle class="pulse" cx="945" cy="155" r="230" fill="url(#glow)"/><circle class="drift" cx="1050" cy="65" r="54" fill="#2867f7" opacity=".12" filter="url(#soft)"/>
  <g transform="translate(78 68)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#85a9ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="5">HELLO, I'M</text>
    <text x="0" y="61" dominant-baseline="hanging" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="70" font-weight="750">Sonali Singh</text>
    <text x="0" y="158" dominant-baseline="hanging" fill="#c9d6f3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="23">data · AI · strategy · product<tspan class="cursor" fill="#6fa0ff">_</tspan></text>
    <rect x="0" y="218" width="82" height="5" rx="3" fill="#2867f7"/><text x="0" y="247" dominant-baseline="hanging" fill="#91a4ca" font-family="Inter,Arial,sans-serif" font-size="18">Evidence in. Useful decisions out.</text>
  </g>
  <g transform="translate(835 72)" stroke-linecap="round" stroke-linejoin="round">
    <rect width="245" height="178" rx="32" fill="#eef3ff" stroke="#a9bce7" stroke-width="5"/><rect x="24" y="24" width="197" height="123" rx="18" fill="#071737" stroke="#4d80f5" stroke-width="4"/>
    <text x="43" y="58" fill="#bcd0ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">HELLO WORLD</text><text x="43" y="88" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700">SONALI</text><text x="43" y="112" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700">SINGH</text>
    <path d="M55 178h135l40 64H15z" fill="#dce6fa" stroke="#a9bce7" stroke-width="5"/><path d="M53 198h100" stroke="#7596df" stroke-width="6"/><circle cx="187" cy="207" r="13" fill="#2867f7" stroke="#1848af" stroke-width="3"/>
  </g>
</svg>
